[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easyrun-uiagent"
version = "0.1.0"
description = "EasyRun UI Agent — 基于 AI Agent 的 UI 自动化测试平台（多 Agent 执行 + 报告中心）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    # 注意：macOS 12 及更早需锁定 1.50（新版 chromium 不再支持旧系统），
    # scripts/bootstrap.sh 会自动处理
    "playwright>=1.49,<2",
    "pillow>=10.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]          # PostgreSQL 驱动（生产）
redis = ["redis>=5.0"]               # Redis 可靠队列（多机部署）
prod = ["asyncpg>=0.30", "redis>=5.0"]  # 兼容别名 = postgres + redis
all = ["asyncpg>=0.30", "redis>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
easyrun = "easyrun.cli:main"

[tool.setuptools.packages.find]
include = ["easyrun*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "browser: 需要 playwright 与 chromium 浏览器内核的集成测试",
]
