<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>EasyRun 演示商城</title>
<style>
body { font: 14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; margin: 0; }
.wrap { max-width: 760px; margin: 40px auto; padding: 0 16px; }
h1 { font-size: 20px; }
.card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin: 14px 0; }
label { display: block; margin: 10px 0 4px; color: #556; }
input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
button { padding: 8px 18px; border: 0; border-radius: 6px; background: #0e7490; color: #fff; cursor: pointer; font-size: 14px; }
button:hover { opacity: .9; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.product { border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; background: #fff; }
.price { color: #b45309; font-weight: 600; }
.top { display: flex; justify-content: space-between; align-items: center; }
.badge { background: #e3f2f6; color: #0a5669; border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.hidden { display: none; }
.error { color: #b91c1c; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>EasyRun 演示商城</h1><span class="badge">测试站点 · 账号 demo / 123456</span></div>

  <div id="login-box" class="card">
    <h2>登录</h2>
    <label for="username">用户名</label>
    <input id="username" placeholder="请输入用户名" value="demo">
    <label for="password">密码</label>
    <input id="password" type="password" placeholder="请输入密码" value="123456">
    <div id="login-error" class="error hidden">用户名或密码错误</div>
    <div style="margin-top:14px"><button id="login-btn">登 录</button></div>
  </div>

  <div id="shop-box" class="hidden">
    <div class="top">
      <h2>商品列表</h2>
      <span id="cart-info" class="badge">购物车 0 件</span>
    </div>
    <div class="grid">
      <div class="product">
        <h3>测试商品 A</h3>
        <p class="price">¥9.90</p>
        <button class="add-btn" data-p="A">加入购物车</button>
      </div>
      <div class="product">
        <h3>测试商品 B</h3>
        <p class="price">¥19.90</p>
        <button class="add-btn" data-p="B">加入购物车</button>
      </div>
    </div>
    <div class="card" style="margin-top:18px">
      <div class="top">
        <span id="cart-detail">购物车为空</span>
        <button id="checkout-btn">去结算</button>
      </div>
    </div>
  </div>
</div>
<script>
var cart = [];
document.getElementById("login-btn").onclick = function () {
  var u = document.getElementById("username").value.trim();
  var p = document.getElementById("password").value;
  if (u === "demo" && p === "123456") {
    document.getElementById("login-box").className = "card hidden";
    document.getElementById("shop-box").className = "";
  } else {
    document.getElementById("login-error").className = "error";
  }
};
function refreshCart() {
  var n = cart.reduce(function (s, x) { return s + x.q; }, 0);
  document.getElementById("cart-info").textContent = "购物车 " + n + " 件";
  document.getElementById("cart-detail").textContent = cart.length
    ? cart.map(function (x) { return "测试商品 " + x.p + " × " + x.q; }).join("，")
    : "购物车为空";
}
document.querySelectorAll(".add-btn").forEach(function (b) {
  b.onclick = function () {
    var p = b.getAttribute("data-p");
    var item = cart.find(function (x) { return x.p === p; });
    if (item) item.q += 1; else cart.push({ p: p, q: 1 });
    refreshCart();
  };
});
document.getElementById("checkout-btn").onclick = function () {
  if (!cart.length) { alert("购物车为空，请先添加商品"); return; }
  location.href = "checkout.html";
};
</script>
</body>
</html>
